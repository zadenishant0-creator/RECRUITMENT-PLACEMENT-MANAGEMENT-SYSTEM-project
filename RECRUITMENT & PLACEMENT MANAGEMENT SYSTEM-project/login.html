<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Recruitment & Placement</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-top">
        <img src="images/logo.png" alt="Kiran Academy Logo" onerror="this.style.display='none'">
        <div>
          <b>KiranAcademy</b>
          <div style="font-size:12px;color:#6b7280;font-weight:700;">Recruitment & Placement Management System</div>
        </div>
      </div>

      <div class="hr"></div>

      <h2 style="margin:0 0 10px;">Login</h2>
      <div class="help">Authorized users only (prototype). Use sample: <b>recruiter@demo.com</b> + any password.</div>

      <div class="error" style="margin-top:12px; display:none;" id="msg">
        Please enter required fields.
      </div>

      <form onsubmit="return false;">
        <div class="grid-2" style="margin-top:12px;">
          <div class="field">
            <label>Username / Email</label>
            <input class="input" type="text" placeholder="recruiter@demo.com" required />
          </div>
          <div class="field">
            <label>Password</label>
            <input class="input" type="password" placeholder="••••••••" required />
          </div>
        </div>

        <div class="field" style="margin-top:14px;">
          <label>Role</label>
          <select required>
            <option value="">Select role</option>
            <option>Admin</option>
            <option>Recruiter</option>
            <option>Placement Officer</option>
          </select>
        </div>

        <div class="btn-row" style="margin-top:16px;">
          <a class="btn btn-primary" href="dashboard.html">Login</a>
          <button class="btn btn-outline" type="reset">Reset</button>
          <a class="btn btn-outline" href="#" onclick="return false;">Forgot Password</a>
        </div>
      </form>

      <div class="hr"></div>
      <div class="help">
        Tip: This is a static prototype. Buttons demonstrate UI workflow only.
      </div>
    </div>
  </div>
</body>
</html>
